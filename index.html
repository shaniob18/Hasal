<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הסל</title>
<meta name="theme-color" content="#1f7a5a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הסל">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#1f7a5a; --brand-2:#2fa67a; --brand-ink:#ffffff; --accent:#f0a03c;
  --bg:#f3f1ea; --bg-grad:radial-gradient(1200px 600px at 100% -10%, #d9efe4 0%, transparent 60%), radial-gradient(900px 500px at -10% 110%, #f6e4cc 0%, transparent 55%);
  --glass:rgba(255,255,255,.72); --glass-border:rgba(255,255,255,.9); --solid:#ffffff;
  --ink:#1b2320; --mute:#64706b; --line:rgba(27,35,32,.10);
  --good:#1f7a5a; --good-bg:rgba(31,122,90,.12); --warn:#a65a12; --warn-bg:rgba(240,160,60,.18); --bad:#b3261e;
  --chip:rgba(27,35,32,.06); --shadow:0 8px 30px rgba(20,40,30,.08);
  --r-lg:22px; --r-md:16px; --r-sm:12px;
}
[data-theme="dark"]{
  --brand:#3cc792; --brand-2:#1f7a5a; --brand-ink:#08130e; --accent:#f3b25e;
  --bg:#0e1412; --bg-grad:radial-gradient(1200px 600px at 100% -10%, #123326 0%, transparent 60%), radial-gradient(900px 500px at -10% 110%, #2a2214 0%, transparent 55%);
  --glass:rgba(26,34,31,.70); --glass-border:rgba(255,255,255,.07); --solid:#18201d;
  --ink:#e8efe9; --mute:#93a19a; --line:rgba(255,255,255,.09);
  --good:#4fd6a0; --good-bg:rgba(60,199,146,.14); --warn:#f3b25e; --warn-bg:rgba(243,178,94,.14); --bad:#ff8a80;
  --chip:rgba(255,255,255,.07); --shadow:0 8px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Heebo,system-ui,sans-serif;background:var(--bg);background-image:var(--bg-grad);background-attachment:fixed;color:var(--ink);font-size:16px;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.glass{background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:var(--r-lg);box-shadow:var(--shadow)}
header{position:sticky;top:0;z-index:10;padding:calc(10px + env(safe-area-inset-top)) 16px 0;background:linear-gradient(var(--bg) 70%, transparent)}
.top{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
.logo{width:38px;height:38px;border-radius:11px}
h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.3px}
.sub{color:var(--mute);font-size:12.5px}
.iconbtn{border:0;background:var(--chip);width:40px;height:40px;border-radius:12px;cursor:pointer;font-size:18px;display:grid;place-items:center}
.tabs{display:flex;gap:4px;max-width:760px;margin:10px auto 0;padding:4px;border-radius:14px;background:var(--chip)}
.tab{flex:1;border:0;background:none;padding:9px 0;border-radius:11px;font-weight:700;color:var(--mute);cursor:pointer}
.tab.on{background:var(--solid);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
main{max-width:760px;margin:0 auto;padding:12px 16px calc(110px + env(safe-area-inset-bottom))}
.hero{padding:18px;color:var(--brand-ink);background:linear-gradient(135deg,var(--brand),var(--brand-2));border:0;border-radius:var(--r-lg);box-shadow:var(--shadow);cursor:pointer;width:100%;text-align:start;display:block}
.hero .k{font-size:13px;opacity:.9}
.hero .s{font-size:21px;font-weight:800;margin-top:2px}
.hero .t{font-size:34px;font-weight:800;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.hero .n{font-size:13.5px;margin-top:6px;opacity:.95}
.add{display:flex;gap:8px;margin-top:12px;padding:6px}
.add input{flex:1;min-width:0;border:0;background:transparent;padding:10px 8px;font-size:16.5px;outline:none}
.btn{border:0;border-radius:var(--r-sm);padding:11px 16px;font-weight:700;cursor:pointer;background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent;color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--brand)}
.btn.soft{background:var(--chip);color:var(--ink)}
.btn.full{width:100%}
.sugg{margin-top:6px;overflow:hidden;padding:0}
.opt{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-inline:0;border-top:0;text-align:start}
.opt:last-child{border-bottom:0}
.opt:hover{background:var(--chip)}
.opt .nm{font-weight:600}
.opt .mt{font-size:12px;color:var(--mute)}
.opt .pr{margin-inline-start:auto;font-weight:800;color:var(--good);white-space:nowrap;font-size:14px}
.bar{display:flex;align-items:center;gap:8px;margin-top:10px;padding:10px 14px;font-size:14px}
.bar .grow{flex:1}
.group{margin-top:16px}
.gh{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 6px;font-weight:800;font-size:14px;color:var(--mute)}
.item{padding:12px 12px 10px;margin-top:8px;transition:opacity .35s, transform .35s}
.item.done{opacity:.55}
.item.leaving{opacity:0;transform:translateX(-40px)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.check{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);background:transparent;cursor:pointer;flex:none;display:grid;place-items:center;font-size:16px;color:var(--brand-ink)}
.item.done .check{background:var(--brand);border-color:var(--brand)}
.iname{font-weight:700;line-height:1.25;position:relative;display:inline}
.iname::after{content:"";position:absolute;inset-inline:0;top:52%;height:2px;background:var(--mute);transform:scaleX(0);transform-origin:right;transition:transform .3s}
.item.done .iname::after{transform:scaleX(1)}
.meta{font-size:12px;color:var(--mute);margin-top:2px}
.qty{display:flex;align-items:center;background:var(--chip);border-radius:12px;flex:none}
.qty button{width:34px;height:34px;border:0;background:none;font-size:19px;cursor:pointer}
.qty span{min-width:44px;text-align:center;font-weight:700;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:0;font-size:12.5px;padding:4px 9px;border-radius:999px;background:var(--chip);white-space:nowrap}
.chip.best{background:var(--good-bg);color:var(--good);font-weight:700}
.chip.warn{background:var(--warn-bg);color:var(--warn);font-weight:600}
.chip.link{cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.mini{border:0;background:none;color:var(--mute);cursor:pointer;font-size:13px;padding:4px 6px;border-radius:8px}
.mini:hover{background:var(--chip)}
.star.on{color:var(--accent)}
.empty{text-align:center;padding:36px 16px;color:var(--mute)}
.empty .e{font-size:44px}
.empty b{display:block;color:var(--ink);font-size:18px;margin:6px 0 4px}
.store{padding:16px;margin-top:10px}
.store.win{box-shadow:inset 0 0 0 2px var(--brand),var(--shadow)}
.sname{font-weight:800;font-size:18px}
.saddr{font-size:12px;color:var(--mute)}
.total{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--brand);color:var(--brand-ink);margin-inline-start:6px;vertical-align:middle}
.note{font-size:12.5px;color:var(--mute);margin-top:6px}
.cmpcard{padding:12px;margin-top:8px}
.cmpcard h4{margin:0 0 6px;font-size:15px}
.cell{display:flex;gap:8px;align-items:baseline;padding:7px 8px;border-radius:10px}
.cell.min{background:var(--good-bg)}
.cell .st{width:78px;flex:none;font-weight:700;font-size:13px}
.cell .pn{flex:1;min-width:0;font-size:12.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .pp{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.cell.min .pp{color:var(--good)}
.tag{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--chip);margin-inline-start:4px;font-weight:600;color:var(--mute)}
.tag.ok{color:var(--good);background:var(--good-bg)}
.tag.g{color:var(--warn);background:var(--warn-bg)}
.tag.p{color:#7a3fd1;background:rgba(122,63,209,.12)}
[data-theme="dark"] .tag.p{color:#c7a6ff}
table.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
table.cmp th,table.cmp td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
table.cmp th{font-size:12px;color:var(--mute)}
table.cmp td.min{background:var(--good-bg)}
table.cmp td.min .pp{color:var(--good)}
table.cmp tfoot td{font-weight:800}
.wide{display:none}
@media (min-width:760px){.wide{display:block}.narrow{display:none}}
.hist{padding:14px;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .2s}
.sheet{width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));background:var(--bg);animation:up .25s}
.sheet h3{margin:0 0 4px;font-size:19px}
.field{display:block;width:100%;padding:12px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--solid);margin-top:8px;outline:none}
.field:focus{border-color:var(--brand)}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.sync{font-size:12.5px;color:var(--mute);margin-top:14px;text-align:center}
.sync a{color:var(--brand)}
.dock{position:fixed;inset-inline:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:20;display:flex;justify-content:center;pointer-events:none}
.dock[hidden]{display:none}
.dock .btn{pointer-events:auto;box-shadow:var(--shadow);border-radius:16px;padding:14px 22px;max-width:728px;width:100%}
.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--chip),rgba(127,127,127,.14),var(--chip));background-size:200% 100%;animation:sh 1.2s infinite;margin:8px 0}
@keyframes sh{to{background-position:-200% 0}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="top">
    <img class="logo" src="icons/icon-192.png" alt="">
    <div class="grow"><h1>הסל</h1><div class="sub" id="sub">טוען מחירים…</div></div>
    <button class="iconbtn" id="theme" aria-label="החלפת מצב כהה ובהיר">🌓</button>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab on" data-v="list" role="tab" aria-selected="true">רשימה <span id="cnt"></span></button>
    <button class="tab" data-v="cmp" role="tab" aria-selected="false">השוואה</button>
    <button class="tab" data-v="hist" role="tab" aria-selected="false">היסטוריה</button>
  </nav>
</header>
<main>
  <section id="v-list">
    <div id="hero"></div>
    <form class="add glass" id="addf" autocomplete="off">
      <label class="sr" for="q">הוספת פריט</label>
      <input id="q" placeholder="מה חסר? למשל: 2 קרטוני ביצים" enterkeyhint="done">
      <button class="btn" aria-label="הוספת הפריט לרשימה">הוספה</button>
    </form>
    <div class="sugg glass" id="sugg" hidden></div>
    <div id="regbar"></div>
    <div id="list"><div class="glass item"><div class="sk" style="width:60%"></div><div class="sk" style="width:85%"></div></div><div class="glass item"><div class="sk" style="width:45%"></div><div class="sk" style="width:75%"></div></div></div>
    <div class="sync" id="sync"></div>
  </section>
  <section id="v-cmp" hidden></section>
  <section id="v-hist" hidden></section>
</main>
<div class="dock" id="dock"></div>
<div id="modal"></div>

<script src="logic.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M=L.money;
let DATA=null, STORES=[], state={items:[],regulars:[],history:[]}, view='list';
let FS=null, db=null, listDoc=null, unsub=null, saving=false, pending=false;

// ---------- theme ----------
function lsGet(k,d){ try{const v=localStorage.getItem(k); return v==null?d:v;}catch(e){return d;} }
function lsSet(k,v){ try{localStorage.setItem(k,v);}catch(e){} }
function applyTheme(){ const t=lsGet('theme','auto'); const dark=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.dataset.theme=dark?'dark':'light'; document.querySelector('meta[name=theme-color]').content=dark?'#0e1412':'#1f7a5a'; }
$('#theme').onclick=()=>{ const t=lsGet('theme','auto'); lsSet('theme', t==='auto'?(document.documentElement.dataset.theme==='dark'?'light':'dark'):(t==='dark'?'light':'dark')); applyTheme(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',applyTheme); applyTheme();

// ---------- count-up numbers ----------
function countUp(el){ const to=+el.dataset.to; const from=+(el.dataset.from||0); if(Math.abs(to-from)<0.01||matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=M(to);return;}
  const t0=performance.now(), d=600; (function f(t){ const k=Math.min(1,(t-t0)/d), e=1-Math.pow(1-k,3); el.textContent=M(from+(to-from)*e); if(k<1) requestAnimationFrame(f); })(t0); }
const lastShown={};
function num(key,v){ const from=lastShown[key]??0; lastShown[key]=v; return `<span class="cu" data-from="${from}" data-to="${v}">${M(from)}</span>`; }
function runCounters(){ document.querySelectorAll('.cu').forEach(countUp); }

// ---------- data ----------
async function loadPrices(){
  try{ DATA=await (await fetch('prices.json',{cache:'no-cache'})).json(); }
  catch(e){ $('#sub').textContent='לא הצלחתי לטעון מחירים'; $('#list').innerHTML=''; return; }
  L.prepare(DATA); STORES=DATA.stores;
  const d=new Date(DATA.updated);
  $('#sub').textContent='מחירים מ־'+(isNaN(d)?DATA.updated:d.toLocaleDateString('he-IL',{day:'numeric',month:'numeric'})+' '+d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}))+' · '+STORES.map(s=>s.name).join(' · ');
  render();
}
function migrate(x){ // lines saved by the first version
  if(!x.unit) x.unit = x.w ? 'ק"ג' : "יח'";
  if(!x.guess) x.guess=(x.codes||[]).map(()=>false);
  if(x.ref===undefined) x.ref=(x.codes||[]).find(Boolean)||null;
  if(!x.cat) x.cat=L.category(x.name);
  x.bought=!!x.bought; delete x.w; return x;
}

// ---------- persistence: Firebase (shared by a family code) + local copy ----------
const FB_CONFIG={apiKey:"AIzaSyAjdGkHwj0NYvHTX3O4gWJho6e9XEMJGxw",authDomain:"hasal-f1192.firebaseapp.com",projectId:"hasal-f1192",storageBucket:"hasal-f1192.firebasestorage.app",messagingSenderId:"239188418535",appId:"1:239188418535:web:18a5f9b8ba74a3f876e742"};
function newCode(){ const a=new Uint8Array(30); crypto.getRandomValues(a); return Array.from(a,b=>'abcdefghjkmnpqrstuvwxyz23456789'[b%31]).join('').replace(/(.{6})(?=.)/g,'$1-'); }
function codeId(c){ return String(c).replace(/[^a-z0-9]/gi,'').toLowerCase(); }
function familyCode(){ let c=lsGet('family-code',''); if(codeId(c).length<24){ c=newCode(); lsSet('family-code',c);} return c; }
function saveLocal(){ lsSet('hasal-state',JSON.stringify(state)); }
function loadLocal(){ try{ const s=JSON.parse(lsGet('hasal-state','null')); if(s) return s; const old=JSON.parse(lsGet('grocery-list','[]')); return {items:old,regulars:[],history:[]}; }catch(e){ return {items:[],regulars:[],history:[]}; } }
function clean(o){ return JSON.parse(JSON.stringify(o)); }
async function save(){
  saveLocal(); if(!listDoc) return;
  if(saving){pending=true;return;} saving=true;
  try{ await FS.setDoc(listDoc,{items:clean(state.items),regulars:clean(state.regulars),history:clean(state.history.slice(0,40)),updatedAt:Date.now()}); setSync(true); }
  catch(e){ console.warn(e); setSync(false); }
  saving=false; if(pending){pending=false;save();}
}
function setSync(ok){ $('#sync').innerHTML=(ok?'☁️ הרשימה משותפת':'📱 נשמר במכשיר (אין חיבור)')+' · <a href="#" id="share">שיתוף עם בן/בת הזוג</a>'; }
function adopt(v){ state={items:(v.items||[]).map(migrate),regulars:v.regulars||[],history:v.history||[]}; }
async function connect(){
  if(unsub){unsub();unsub=null;} if(!FS) return;
  listDoc=FS.doc(db,'lists',codeId(familyCode())); let first=true;
  unsub=FS.onSnapshot(listDoc,snap=>{
    const v=snap.exists()?snap.data():null;
    if(first){ first=false; if(v&&(v.items?.length||v.regulars?.length||v.history?.length||!state.items.length)) adopt(v); else if(state.items.length) save(); }
    else if(v&&!saving&&!snap.metadata.hasPendingWrites) adopt(v);
    saveLocal(); render(); setSync(true);
  },()=>setSync(false));
}
async function initDb(){
  const m=location.hash.match(/f=([a-z0-9-]{24,})/i);
  if(m){ lsSet('family-code',m[1].toLowerCase()); history.replaceState(null,'',location.pathname); }
  adopt(loadLocal()); render(); setSync(false);
  try{
    const V='10.12.2';
    const app=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    FS=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
    db=FS.initializeFirestore(app.initializeApp(FB_CONFIG),{localCache:FS.persistentLocalCache()});
    await connect();
  }catch(e){ console.warn(e); setSync(false); }
}
function commit(){ save(); render(); }

// ---------- list actions ----------
function lineFromText(text){
  const p=L.parseLine(text); if(!p.name) return null;
  const g=L.guess(DATA,p.name,p.unit);
  return {id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), name:p.name, qty:p.qty, unit:p.unit, codes:g.codes, guess:g.guess, ref:g.ref, cat:L.category(p.name), bought:false};
}
function lineFromProduct(it, text){
  const p=text?L.parseLine(text):{qty:1,unit:it[5]?'ק"ג':"יח'"};
  return {id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), name:it[1], qty:p.qty, unit:it[5]&&p.unit==="יח'"?'ק"ג':p.unit,
    codes:it[3].map(pr=>pr!=null?it[0]:null), guess:it[3].map(()=>false), ref:it[0], cat:L.category(it[1]), bought:false};
}
function addLine(l){ if(!l) return; const ex=state.items.find(x=>!x.bought&&(x.ref&&x.ref===l.ref&&!l.guess.some(Boolean)||L.norm(x.name)===L.norm(l.name))); if(ex){ ex.qty=+(ex.qty+l.qty).toFixed(2); } else state.items.unshift(l); commit(); }
const STEP=u=>u==='ק"ג'?0.5:u==='גרם'?100:u==='ליטר'?0.5:u==='מ"ל'?100:1;
function findLine(id){ return state.items.find(x=>x.id===id); }
function isRegular(l){ return state.regulars.some(r=>L.norm(r.name)===L.norm(l.name)); }

// ---------- render: list ----------
function heroHtml(c){
  if(!state.items.length||!c.best) return '';
  const b=c.best, miss=b.missing.length;
  return `<button class="hero" id="tohero" aria-label="מעבר להשוואה המלאה">
    <div class="k">הכי משתלם עכשיו</div>
    <div class="s">${esc(b.store.name)} · ${esc(b.store.addr.split(',')[0])}</div>
    <div class="t">${num('hero',b.total)}</div>
    <div class="n">${c.saving>0.05?`חוסך ${M(c.saving)} מול היקר`:'כמעט אותו מחיר בכל הסניפים'}${miss?` · חסרים בו ${miss}`:''}${b.guesses?` · ${b.guesses} ניחושים`:''}</div></button>`;
}
function lineHtml(x,c){
  const row=c.rows.find(r=>r.line===x);
  const chips=STORES.map((s,i)=>{ const p=row&&row.cells[i];
    if(!p) return `<span class="chip">${esc(s.name)}: אין</span>`;
    return `<span class="chip ${row.cheapest[i]&&row.cells.filter(Boolean).length>1?'best':''}">${esc(s.name)}: ${M(p.compareCost)}${p.promo&&p.promo.applied?' 🏷':''}</span>`; }).join('');
  const anyGuess=x.guess&&x.guess.some(Boolean);
  const u=x.unit==="יח'"?'':' '+x.unit;

  $('#list').innerHTML=order.map(g=>{ const its=groups[g].slice().sort((a,b)=>a.bought-b.bought);

$('#list').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const card=b.closest('.item'); const x=findLine(card.dataset.id); if(!x) return;
  const a=b.dataset.act;
  if(a==='buy'){ x.bought=!x.bought; card.classList.toggle('done',x.bought); setTimeout(commit,320); return; }
  if(a==='inc'){ x.qty=+(+x.qty+STEP(x.unit)).toFixed(2); }
  else if(a==='dec'){ const s=STEP(x.unit); if(x.qty>s) x.qty=+(x.qty-s).toFixed(2); else { card.classList.add('leaving'); setTimeout(()=>{state.items=state.items.filter(y=>y!==x);commit();},300); return; } }
  else if(a==='del'){ card.classList.add('leaving'); setTimeout(()=>{state.items=state.items.filter(y=>y!==x);commit();},300); return; }
  else if(a==='reg'){ if(isRegular(x)) state.regulars=state.regulars.filter(r=>L.norm(r.name)!==L.norm(x.name)); else state.regulars.push({name:x.name,qty:x.qty,unit:x.unit,codes:x.codes,guess:x.guess,ref:x.ref,cat:x.cat}); }

  else if(a==='edit'){ openEdit(x); return; }
  commit();
});

function cellTags(p,x,i){ if(!p) return ''; let t=p.status==='exact'?'<span class="tag ok">✓</span>':(x.guess&&x.guess[i]?'<span class="tag g">ניחוש</span>':'<span class="tag">דומה</span>');

function renderCmp(c){

  const cards=c.ranked.map(s=>`<div class="glass store ${s===c.best?'win':''}"><div class="row"><div class="grow"><div class="sname">${esc(s.store.name)}${s===c.best?'<span class="badge">הכי משתלם</span>':''}</div><div class="saddr">${esc(s.store.addr)}</div></div><div class="total">${num('st'+s.i,s.total)}</div></div>
    <div class="note">${s.missing.length?`<span style="color:var(--warn)">חסרים ${s.missing.length}: ${esc(s.missing.slice(0,3).join(', '))}${s.missing.length>3?'…':''}</span> · `:'כל הפריטים קיימים · '}${s.guesses?`${s.guesses} ניחושים או מוצרים דומים`:'הכל מוצרים זהים'}${s.saved>0.05?` · כולל ${M(s.saved)} מבצעים`:''}</div></div>`).join('');
  const sp=c.split, split = sp.stores.length>1 && !sp.missing && sp.saving>0.5 ? `<div class="glass store"><div class="sname">✂️ פיצול חכם</div><div class="note" style="font-size:14px;color:var(--ink)">אם קונים כל פריט בסניף שבו הוא הכי זול: <b>${M(sp.total)}</b>, חיסכון של <b>${M(sp.saving)}</b> מול ${esc(c.best.store.name)}, אבל ב־${sp.stores.length} עצירות (${sp.stores.map(i=>esc(STORES[i].name)).join(' + ')}).</div></div>`:'';

  const wide=`<div class="glass" style="padding:8px 12px;margin-top:10px;overflow-x:auto"><table class="cmp"><thead><tr><th>פריט</th>${STORES.map(s=>`<th>${esc(s.name)}</th>`).join('')}</tr></thead><tbody>

    </tbody><tfoot><tr><td>סה"כ</td>${c.stores.map(s=>`<td>${M(s.total)}<div class="note" style="margin:0;font-weight:400">${s.missing.length?`חסרים ${s.missing.length}`:''}${s.guesses?` · ${s.guesses} ניחושים`:''}</div></td>`).join('')}</tr></tfoot></table></div>`;

}

// ---------- shell ----------
function show(v){ view=v; document.querySelectorAll('.tab').forEach(t=>{const on=t.dataset.v===v; t.classList.toggle('on',on); t.setAttribute('aria-selected',on);});
  for(const s of ['list','cmp','hist']) $('#v-'+s).hidden=s!==v; $('#dock').hidden=v!=='list'; render(); window.scrollTo({top:0}); }
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>show(t.dataset.v));
function render(){
  if(!DATA) return;
  const c=L.compare(DATA,state.items);
  if(view==='list') renderList(c); else if(view==='cmp') renderCmp(c); else renderHist();
  $('#cnt').textContent=state.items.length?`(${state.items.filter(x=>!x.bought).length})`:'';
  runCounters();
}
loadPrices(); initDb();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
